id: R2
name: Double refund attempts across the three refund paths
property_under_test:
- P2
preconditions:
- 'A purchase is refundable on two paths at once: its own case (FAIL or UNSERVED, claimRefund(nonce)), its failed epoch (claimEpochFailure) or the frozen pool (claimRefund with the receipt)'
injected_fault:
  process: buyer
  kind: double_refund_attempt
  action: buyer calls every refund path open to the purchase, in the order given by order
  timing: after both paths are open
parameters:
  overlap:
    default: own_fail_and_pool
    sweep:
    - own_fail_and_pool
    - own_unserved_and_pool
    - epoch_failed_and_pool
    unit: which two paths are open
  order:
    default: own_first
    sweep:
    - own_first
    - pool_first
    unit: call order
n_seeds: 3
observed_metrics:
  core:
  - double_settlement_rate
  - post_settlement_unrecovered_rate
  - released_exposure
  - anchor_gas_per_epoch
  - retention_storage_bytes
  - captured_funds_time_average
  - false_positive_recovery_amount
  - locked_capital
  - gas_per_settlement
  - gas_per_judgment
  - gas_per_dispute
  - gas_per_call
  - recovery_time_blocks
  - judgment_delay_distribution
  extended:
  - cheater_net_gain
  - sales_lost_while_suspended
  - exposure_vs_bond
  - buyer_recovery_rate
  - honest_seller_delay_blocks
  - honest_seller_suspended_fraction
  - frozen_amount
  - rejected_settlement_count
  - capital_locked_time_integral
  - realized_detection_rate
  - realized_sample_rate
  scenario_specific:
  - refund_payout_count
  - double_refund_count
expected_outcome: 'The first successful call pays v; every later call on the same purchase reverts. The pool claim excludes a frozen entry whose buyer already has a refund right of its own, and a purchase refunded through its own case or its epoch leaves the frozen pool.'
ground_truth_source: 'controller (experiments/controller) records the injected fault, the true event sequence and the expected verdict outside the runtime processes; no buyer, seller, facilitator, verifier, keeper or anvil process can read it'
pass_criteria: 'At every point: double_refund_count == 0, every element of refund_payout_count is 1, and the sum paid per purchase equals v. Any second payout refutes the at-most-once refund rule.'
notes: Checks refund uniqueness across paths, beyond uniqueness inside the pool.
