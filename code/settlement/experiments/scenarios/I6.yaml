expected_outcome: 'Admissible cells with the keeper delay within the margin (M4-worst: within the slack T_hold - L_actual the measured path leaves): released exposure per episode at most g/p at every rate, scale and bond (the low-rate cells show the g/p term; the high-rate cells are near zero), including M4 and M4-worst with the cap off (M4-worst about 9g) and the worst-path cells P5-margin and P6; no effective-detection case with case_path_minus_keeper above T_case - marginBlocks; net gain per episode negative at B >= k*g*ceil(1/p) and at most g/p - B/k everywhere; realized detection rate at least s*(h*(1 - beta))^2 on the normal path (s on the worst path). Comparison cells: exposure at most g*(1/p + n*(q + r_fill*(T_catch + kappa - T_hold)+)). Positive controls P5-over and P5-short-hold (defined relative to L_actual_min): a post-detection leak; a control fails only if the leak is zero in every run, and is marked for investigation with a leak in fewer than 27 of 30 runs. Honest arm: no sanction at scale 1, 3 or 7 and wrongful confirmed failures per sampled case at most 3*w1^2.'
ground_truth_source: 'controller (experiments/controller) records the injected fault, the true event sequence and the expected verdict outside the runtime processes; no buyer, seller, facilitator, verifier, keeper or anvil process can read it'
pass_criteria: 'Result table, one row per point of a cell, with the first and second episode apart: released_exposure, second_episode_exposure, post_detection_leak, episode_net_gain and second_episode_net_gain as mean and 95 percent interval (bootstrap over runs, 10,000 resamples) with the repetition count; configured and achieved settlement rate; realized_detection_rate pooled with its exact interval beside s*(h*(1 - beta))^2, p and p*; keeper_delay_sum_max_blocks and the number of runs past the margin; case_path_blocks and case_path_minus_keeper per effective-detection case beside T_case - marginBlocks, T_case and L_actual (the dry run records its largest and smallest value); releases_after_reentry in the margin-overrun cells; the honest-arm window counts, honest_top_up_count and honest_max_window_scale. The conditions, families and pruning rule are in analysis; only fault_observed failures and assignment gaps explained by harness logs take a run outside the premise, and a low realized detection rate is never an exclusion.'
notes: 'Planned only; do not run until the services read directives (D2). The worst-path directives are planned by the controller (experiments/controller/worstpath.py) and are part of the D2 completion condition, which includes recording L_actual from the dry run of the worst path; the L_actual-relative values of P5-over, P5-short-hold and M4-worst are resolved from it and recorded before the main run. Cells below T_case use the override build with freezeOnInitialFail = true except P5-short-hold, which keeps the production timing to show the leak; P4 cells run only when the controller is started with --profile-name open-weights-standard-v1. Low-rate cells are pruned in the analysis.pruning order to 60 repetitions (never below) if the compute budget requires, and second-episode judgments need at least 30 runs with a finished second episode.'
