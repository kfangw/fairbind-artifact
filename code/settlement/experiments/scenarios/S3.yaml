id: S3
name: Redelivery refused
property_under_test:
- P2
preconditions:
- The seller delivered the first response (a receipt exists)
- The buyer opens a NON_DELIVERY or WRONG_DELIVERY dispute
injected_fault:
  process: seller
  kind: refuse_redelivery
  action: 'seller refuses requestServe: no served() and no publication before serveDue or publishDue'
  timing: from SERVE_WAIT to serveDue, or from PUBLISHING to publishDue
parameters:
  serveBlocks:
    default: 50
    unit: blocks
  refusal_stage:
    default: serve_wait
    sweep:
    - serve_wait
    - publishing
n_seeds: 3
observed_metrics:
  core:
  - double_settlement_rate
  - post_settlement_unrecovered_rate
  - released_exposure
  - anchor_gas_per_epoch
  - retention_storage_bytes
  - captured_funds_time_average
  - false_positive_recovery_amount
  - locked_capital
  - gas_per_settlement
  - gas_per_judgment
  - gas_per_dispute
  - gas_per_call
  - recovery_time_blocks
  - judgment_delay_distribution
  extended:
  - cheater_net_gain
  - sales_lost_while_suspended
  - exposure_vs_bond
  - buyer_recovery_rate
  - honest_seller_delay_blocks
  - honest_seller_suspended_fraction
  - frozen_amount
  - rejected_settlement_count
  - capital_locked_time_integral
  - realized_detection_rate
  - realized_sample_rate
expected_outcome: timeoutServe ends the case UNSERVED at either refusal stage. A signed receipt does not help the seller unless the response is actually published.
ground_truth_source: 'controller (experiments/controller) records the injected fault, the true event sequence and the expected verdict outside the runtime processes; no buyer, seller, facilitator, verifier, keeper or anvil process can read it'
pass_criteria: 'At every refusal stage the case ends UNSERVED and the buyer is refunded (post_settlement_unrecovered_rate == 0); the first final failure applies seller consequences exactly once.'
notes: Checks that the protocol asks whether the seller produces the response, not whether the buyer received it.
