id: F3
name: Seller restart
property_under_test:
- P1
- P2
preconditions:
- The seller process restarts after settle is confirmed, before or after producing the response
injected_fault:
  process: seller
  kind: process_restart
  trigger: restart_point
  action: process restart (crash and recovery) between settle confirmation and response delivery
  timing: at the point named by restart_point
parameters:
  restart_point:
    default: uniform_random
    sweep:
    - before_response_generated
    - after_response_generated_before_send
    - after_send_before_receipt_store
  W_retention_blocks:
    default: 2000
    unit: blocks
n_seeds: 3
observed_metrics:
  core:
  - double_settlement_rate
  - post_settlement_unrecovered_rate
  - released_exposure
  - anchor_gas_per_epoch
  - retention_storage_bytes
  - captured_funds_time_average
  - false_positive_recovery_amount
  - locked_capital
  - gas_per_settlement
  - gas_per_judgment
  - gas_per_dispute
  - gas_per_call
  - recovery_time_blocks
  - judgment_delay_distribution
  extended:
  - cheater_net_gain
  - sales_lost_while_suspended
  - exposure_vs_bond
  - buyer_recovery_rate
  - honest_seller_delay_blocks
  - honest_seller_suspended_fraction
  - frozen_amount
  - rejected_settlement_count
  - capital_locked_time_integral
  - realized_detection_rate
  - realized_sample_rate
  scenario_specific:
  - state_recovery_time_blocks
expected_outcome: The restarted seller compares its local receipt store (retention W) with getPurchase to restore paid requests. It issues the response exactly once, or the purchase moves to redelivery and ends UNSERVED.
ground_truth_source: 'controller (experiments/controller) records the injected fault, the true event sequence and the expected verdict outside the runtime processes; no buyer, seller, facilitator, verifier, keeper or anvil process can read it'
pass_criteria: No double settlement (double_settlement_rate == 0) and at every restart point the buyer eventually gets delivery or a refund (post_settlement_unrecovered_rate == 0).
notes: 'The only fault scenario covering both P1 and P2; tied to the seller restart recovery requirement.'
