id: K2
name: Seal window missed on purpose
property_under_test:
- P5
preconditions:
- 'A cheating seller sells bad responses at rate:peak_hour_p99'
- After the random block the seller can compute which of its purchases are sampled
injected_fault:
  process:
  - seller
  - keeper
  kind: seal_withholding
  action: 'seller does not call seal for an epoch in which one of its bad sales is sampled; keepers are live or down per keepers_live'
  timing: inside each seal window
parameters:
  keepers_live:
    default: true
    sweep:
    - true
    - false
    unit: bool
  Lambda_cheater:
    default: rate:peak_hour_p99
    unit: settlements per block
n_seeds: 10
observed_metrics:
  core:
  - double_settlement_rate
  - post_settlement_unrecovered_rate
  - released_exposure
  - anchor_gas_per_epoch
  - retention_storage_bytes
  - captured_funds_time_average
  - false_positive_recovery_amount
  - locked_capital
  - gas_per_settlement
  - gas_per_judgment
  - gas_per_dispute
  - gas_per_call
  - recovery_time_blocks
  - judgment_delay_distribution
  extended:
  - cheater_net_gain
  - sales_lost_while_suspended
  - exposure_vs_bond
  - buyer_recovery_rate
  - honest_seller_delay_blocks
  - honest_seller_suspended_fraction
  - frozen_amount
  - rejected_settlement_count
  - capital_locked_time_integral
  - realized_detection_rate
  - realized_sample_rate
  scenario_specific:
  - epoch_failed_count
  - sample_escape_rate
  - unopened_sample_count
expected_outcome: 'With live keepers the seal is called by a keeper inside the window whatever the seller does: no epoch fails and nothing escapes. With the keepers down the seller seals only epochs with no sampled bad sale; every epoch with one fails with SEAL_TIMEOUT, its purchases are refunded with no seller counter, and realized_detection_rate falls to about 0 while the seller keeps g on bad sales in sealed epochs.'
ground_truth_source: 'controller (experiments/controller) records the injected fault, the true event sequence and the expected verdict outside the runtime processes; no buyer, seller, facilitator, verifier, keeper or anvil process can read it'
pass_criteria: 'keepers_live true: epoch_failed_count == 0 and sample_escape_rate == 0 (anything else refutes the keeper assumption in the harness). keepers_live false: sample_escape_rate and cheater_net_gain are reported; they state what the keeper assumption buys.'
notes: 'The implementation seals from a settlement-chain block hash with a 200-block window; the seller sees the randomness before the window closes.'
