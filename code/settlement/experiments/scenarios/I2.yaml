id: I2
name: Above-threshold FINAL(INCONCLUSIVE) path for an honest seller
property_under_test:
- P3
preconditions:
- An honest seller whose responses the predicate cannot evaluate at rate natural_inconclusive_rate
- Admissible profile, maxInconclusivePpm 0.2
injected_fault:
  process: seller
  kind: natural_inconclusive
  action: seller returns correct responses of which a fraction natural_inconclusive_rate makes the predicate return INCONCLUSIVE
  timing: continuously
parameters:
  natural_inconclusive_rate:
    default: 0.1
    sweep:
    - 0.1
    - 0.3
    unit: fraction of responses
  Lambda_honest:
    default: rate:peak_hour_p99
    unit: settlements per block
n_seeds: 10
observed_metrics:
  core:
  - double_settlement_rate
  - post_settlement_unrecovered_rate
  - released_exposure
  - anchor_gas_per_epoch
  - retention_storage_bytes
  - captured_funds_time_average
  - false_positive_recovery_amount
  - locked_capital
  - gas_per_settlement
  - gas_per_judgment
  - gas_per_dispute
  - gas_per_call
  - recovery_time_blocks
  - judgment_delay_distribution
  extended:
  - cheater_net_gain
  - sales_lost_while_suspended
  - exposure_vs_bond
  - buyer_recovery_rate
  - honest_seller_delay_blocks
  - honest_seller_suspended_fraction
  - frozen_amount
  - rejected_settlement_count
  - capital_locked_time_integral
  - realized_detection_rate
  - realized_sample_rate
  scenario_specific:
  - inconclusive_ratio_observed
  - honest_seller_pool_loss
  - final_failure_count
  - seller_penalty_charged
  - suspension_count
expected_outcome: 'At 0.1 the inconclusive ratio stays below 0.2 and nothing is frozen. At 0.3 the first FINAL(INCONCLUSIVE) that takes the ratio above 0.2 freezes the bond account and suspends the seller; it is never counted toward failureLimit and never slashes, but the claim window opens and buyers holding receipts claim the frozen pool, so an honest seller loses about v times the entries held at the freeze.'
ground_truth_source: 'controller (experiments/controller) records the injected fault, the true event sequence and the expected verdict outside the runtime processes; no buyer, seller, facilitator, verifier, keeper or anvil process can read it'
pass_criteria: 'At 0.1: suspension_count == 0 and honest_seller_pool_loss == 0. At 0.3: suspension_count >= 1, final_failure_count == 0, seller_penalty_charged == 0, and honest_seller_pool_loss is reported. A failure counted or a penalty charged refutes the inconclusive rule.'
notes: Measures the cost of the inconclusive threshold for an honest seller whose service the predicate cannot always judge. The ratio counts only sampled cases once the denominator excludes disputes.
