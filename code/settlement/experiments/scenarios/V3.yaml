id: V3
name: Seller and verifier collusion
property_under_test:
- P4
preconditions:
- The seller delivers a response that actually fails
- The assigned verifier colludes with the seller and submits PASS
injected_fault:
  process:
  - seller
  - verifier
  kind: collusion
  action: seller colludes with the assigned verifier to obtain PASS on a failing delivery
  timing: when judge() is called
  target: prior agreement with the assigned verifier
parameters:
  collusion_rate:
    default: 1.0
    sweep:
    - 0.0
    - 0.5
    - 1.0
    unit: fraction of assignments colluded
  auto_recheck_prob_pi_v:
    default: profile_default
    unit: probability
  h_honest_bond_fraction:
    default: h
    sweep:
    - h
    - 1.0
    unit: fraction
n_seeds: 30
observed_metrics:
  core:
  - double_settlement_rate
  - post_settlement_unrecovered_rate
  - released_exposure
  - anchor_gas_per_epoch
  - retention_storage_bytes
  - captured_funds_time_average
  - false_positive_recovery_amount
  - locked_capital
  - gas_per_settlement
  - gas_per_judgment
  - gas_per_dispute
  - gas_per_call
  - recovery_time_blocks
  - judgment_delay_distribution
  extended:
  - cheater_net_gain
  - sales_lost_while_suspended
  - exposure_vs_bond
  - buyer_recovery_rate
  - honest_seller_delay_blocks
  - honest_seller_suspended_fraction
  - frozen_amount
  - rejected_settlement_count
  - capital_locked_time_integral
  - realized_detection_rate
  - realized_sample_rate
  scenario_specific:
  - collusion_detection_rate
expected_outcome: A colluding PASS is rechecked by a second verifier with probability pi_v. If an honest verifier is drawn (probability depends on h) the verdict is reversed and a third verifier decides.
ground_truth_source: 'controller (experiments/controller) records the injected fault, the true event sequence and the expected verdict outside the runtime processes; no buyer, seller, facilitator, verifier, keeper or anvil process can read it'
pass_criteria: 'For h at or above the stated bound, collusion_detection_rate is at least pi_v (h(1 - beta))^2. If the scenario is not executed, the file records the design only and the controller log records that it was skipped.'
notes: 'This scenario may be left unexecuted; the controller records whether it ran.'
