id: S6
name: Patient defection after a long honest period
property_under_test:
- P2
- P5
- EXPOSURE
preconditions:
- Admissible profile (D = the profile hold period)
- The seller trades honestly for warmup_sessions sales and builds a normal history
injected_fault:
  process: seller
  kind: patient_defection
  action: seller behaves honestly for a long warm-up, then defects on a large batch within one judgment window before any sample can catch earlier batches
  timing: after the warm-up, within one judgment window L
parameters:
  warmup_sessions:
    default: 700
    unit: count
  defection_batch_size:
    default: 1.0
    sweep:
    - 0.5
    - 1.0
    - 2.0
    unit: multiple of Lambda_max * L
  cap_enabled:
    default: true
    sweep:
    - true
    - false
n_seeds: 30
observed_metrics:
  core:
  - double_settlement_rate
  - post_settlement_unrecovered_rate
  - released_exposure
  - anchor_gas_per_epoch
  - retention_storage_bytes
  - captured_funds_time_average
  - false_positive_recovery_amount
  - locked_capital
  - gas_per_settlement
  - gas_per_judgment
  - gas_per_dispute
  - gas_per_call
  - recovery_time_blocks
  - judgment_delay_distribution
  extended:
  - cheater_net_gain
  - sales_lost_while_suspended
  - exposure_vs_bond
  - buyer_recovery_rate
  - honest_seller_delay_blocks
  - honest_seller_suspended_fraction
  - frozen_amount
  - rejected_settlement_count
  - capital_locked_time_integral
  - realized_detection_rate
  - realized_sample_rate
  scenario_specific:
  - seller_penalty_charged
  - freeze_delay_blocks
expected_outcome: 'The defection batch settles within one judgment window, which is shorter than D, so when the first detected bad sale freezes the bond account every batch sale and every honest sale of the last D blocks is still held. The buyers claim them from the frozen pool and the rest is forfeited, so cheater_net_gain is about (g - v) times the batch minus v times the honest sales of the last D blocks: at most 0 for g = v. One final failure charges one share of sellerPenalty (sellerPenalty / failureLimit), not the whole. Patience buys nothing because nothing defected on is released before the freeze.'
ground_truth_source: 'controller (experiments/controller) records the injected fault, the true event sequence and the expected verdict outside the runtime processes; no buyer, seller, facilitator, verifier, keeper or anvil process can read it'
pass_criteria: 'At every batch size, with the cap on or off: released_exposure is 0 in every run, cheater_net_gain <= 0 in every run, and seller_penalty_charged == 0. A released batch sale or a charged penalty contradicts the freeze rule or the sanction rule.'
notes: The protection here is the freeze and the claim path, not a penalty at the first failure. The full collateral comparison (baseline B4) and the other baseline arms are in run-list.json.
