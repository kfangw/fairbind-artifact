id: F1
name: Facilitator stops right after broadcast
property_under_test:
- P1
preconditions:
- The buyer signs an EIP-3009 authorization
- The facilitator broadcasts the settle transaction
injected_fault:
  process: facilitator
  kind: process_restart
  trigger: settle_broadcast
  action: process crash immediately after transaction broadcast, before receiving confirmation
  timing: after settle tx broadcast, before receipt of tx confirmation
parameters:
  responseBlocks:
    default: 50
    unit: blocks
  claimBlocks:
    default: 200
    unit: blocks
  facilitator_restart_delay:
    default: 10
    sweep:
    - 0
    - 5
    - 20
    - 100
    unit: blocks
n_seeds: 3
observed_metrics:
  core:
  - double_settlement_rate
  - post_settlement_unrecovered_rate
  - released_exposure
  - anchor_gas_per_epoch
  - retention_storage_bytes
  - captured_funds_time_average
  - false_positive_recovery_amount
  - locked_capital
  - gas_per_settlement
  - gas_per_judgment
  - gas_per_dispute
  - gas_per_call
  - recovery_time_blocks
  - judgment_delay_distribution
  extended:
  - cheater_net_gain
  - sales_lost_while_suspended
  - exposure_vs_bond
  - buyer_recovery_rate
  - honest_seller_delay_blocks
  - honest_seller_suspended_fraction
  - frozen_amount
  - rejected_settlement_count
  - capital_locked_time_integral
  - realized_detection_rate
  - realized_sample_rate
  scenario_specific:
  - settle_retry_count
  - keyId_duplicate_detection_rate
expected_outcome: A restarted facilitator or a retrying seller may resend with the same keyId, but settle is confirmed at most once. If both transactions are included, the nonce and keyId checks leave only one valid.
ground_truth_source: 'controller (experiments/controller) records the injected fault, the true event sequence and the expected verdict outside the runtime processes; no buyer, seller, facilitator, verifier, keeper or anvil process can read it'
pass_criteria: 'double_settlement_rate == 0 at every restart delay; the resent settle reverts or is observed as a no-op.'
notes: The facilitator restarts before its transaction is confirmed and may retry without knowing it. Chain reorganization is out of scope.
