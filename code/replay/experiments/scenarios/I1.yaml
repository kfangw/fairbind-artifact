id: I1
name: Verifier always INCONCLUSIVE
property_under_test:
- P4
- P5
preconditions:
- 'A cheating seller sells bad responses at rate:peak_hour_p99 on the admissible profile'
- A share colluding_weight of the verifier bond answers INCONCLUSIVE to every case it is assigned
injected_fault:
  process:
  - seller
  - verifier
  kind: verifier_always_inconclusive
  action: colluding verifiers submit INCONCLUSIVE on every assigned case
  timing: every assignment
parameters:
  colluding_weight:
    default: 0.1
    sweep:
    - 0.1
    - 0.33
    unit: share of verifier bond weight
  Lambda_cheater:
    default: rate:peak_hour_p99
    unit: settlements per block
n_seeds: 30
observed_metrics:
  core:
  - double_settlement_rate
  - post_settlement_unrecovered_rate
  - released_exposure
  - anchor_gas_per_epoch
  - retention_storage_bytes
  - captured_funds_time_average
  - false_positive_recovery_amount
  - locked_capital
  - gas_per_settlement
  - gas_per_judgment
  - gas_per_dispute
  - gas_per_call
  - recovery_time_blocks
  - judgment_delay_distribution
  extended:
  - cheater_net_gain
  - sales_lost_while_suspended
  - exposure_vs_bond
  - buyer_recovery_rate
  - honest_seller_delay_blocks
  - honest_seller_suspended_fraction
  - frozen_amount
  - rejected_settlement_count
  - capital_locked_time_integral
  - realized_detection_rate
  - realized_sample_rate
  scenario_specific:
  - inconclusive_ratio_observed
  - freeze_delay_blocks
  - seller_penalty_charged
expected_outcome: 'An INCONCLUSIVE first verdict is final: no appeal, no recheck and no wrong-verdict penalty. A sampled bad sale drawn to a colluding verifier therefore escapes, and the realized detection rate falls toward pi (1 - colluding_weight)(1 - beta). The profile p already assumes a dishonest share of 1 - h = 0.33, so the realized rate stays at or above p = 0.04 at both weights. The inconclusive ratio of the bond account is about colluding_weight: at 0.1 it stays below maxInconclusivePpm (0.2); at 0.33 it crosses it, and FINAL(INCONCLUSIVE) above the threshold freezes and suspends the seller, so collusion at that weight also stops the cheater.'
ground_truth_source: 'controller (experiments/controller) records the injected fault, the true event sequence and the expected verdict outside the runtime processes; no buyer, seller, facilitator, verifier, keeper or anvil process can read it'
pass_criteria: 'realized_detection_rate >= p at both weights (its 95 percent interval wholly below p refutes the p bound for this collusion); inconclusive_ratio_observed within 0.05 of colluding_weight; at 0.33 a freeze occurs in every run and seller_penalty_charged == 0 (inconclusive outcomes never count toward failureLimit).'
notes: 'The cheapest collusion: nothing is paid for an INCONCLUSIVE vote.'
