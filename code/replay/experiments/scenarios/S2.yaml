id: S2
name: Anchor withheld
property_under_test:
- P2
preconditions:
- Epoch e has settlements
- The seller does not call anchor() before anchorDeadline(e)
injected_fault:
  process: seller
  kind: withhold_anchor
  action: seller withholds the anchor() call past anchorDeadline(e)
  timing: past anchorDeadline(e)
parameters:
  anchorBlocks:
    default: profile_default
    unit: blocks
  overrun_blocks:
    default: 1
    sweep:
    - 1
    - 10
    - 100
    unit: blocks past anchorDeadline
n_seeds: 3
observed_metrics:
  core:
  - double_settlement_rate
  - post_settlement_unrecovered_rate
  - released_exposure
  - anchor_gas_per_epoch
  - retention_storage_bytes
  - captured_funds_time_average
  - false_positive_recovery_amount
  - locked_capital
  - gas_per_settlement
  - gas_per_judgment
  - gas_per_dispute
  - gas_per_call
  - recovery_time_blocks
  - judgment_delay_distribution
  extended:
  - cheater_net_gain
  - sales_lost_while_suspended
  - exposure_vs_bond
  - buyer_recovery_rate
  - honest_seller_delay_blocks
  - honest_seller_suspended_fraction
  - frozen_amount
  - rejected_settlement_count
  - capital_locked_time_integral
  - realized_detection_rate
  - realized_sample_rate
  scenario_specific:
  - suspension_count
  - reinstatement_count
  - final_failure_count
  - seller_penalty_charged
expected_outcome: 'Anyone may call timeoutAnchor after anchorDeadline(e). The epoch becomes EPOCH_FAILED, each of its purchases becomes refundable from the contract record without a receipt or Merkle proof, and because a missed anchor is the seller''s failure the call freezes the bond account, suspends the seller, opens the claim window and records one final failure and deducts one share of the seller penalty (sellerPenalty / failureLimit); the remainder is charged at failureLimit.'
ground_truth_source: 'controller (experiments/controller) records the injected fault, the true event sequence and the expected verdict outside the runtime processes; no buyer, seller, facilitator, verifier, keeper or anvil process can read it'
pass_criteria: 'At every overrun point: timeoutAnchor succeeds after anchorDeadline, every purchase of the epoch is refunded (post_settlement_unrecovered_rate == 0), frozen_amount has one element, suspension_count == 1, final_failure_count == 1 and seller_penalty_charged == 0. After the claim window closes, reinstateSeller succeeds (reinstatement_count == 1).'
notes: Observes the epoch-failure rule of lifecycle-v1.md section 8 together with the bond-account freeze.
