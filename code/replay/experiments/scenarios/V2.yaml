id: V2
name: Verifier wrong verdict
property_under_test:
- P3
- P4
preconditions:
- A verifier is assigned and submits the opposite of the correct verdict
injected_fault:
  process: verifier
  kind: wrong_verdict
  action: assigned verifier submits an incorrect verdict (controller ground truth differs from the verdict)
  timing: before judgeDue
parameters:
  misjudgment_direction:
    default: false_fail
    sweep:
    - false_fail
    - false_pass
  appeal_triggered:
    default: true
    sweep:
    - true
    - false
  auto_recheck_prob_pi_v:
    default: profile_default
    unit: probability
n_seeds: 30
observed_metrics:
  core:
  - double_settlement_rate
  - post_settlement_unrecovered_rate
  - released_exposure
  - anchor_gas_per_epoch
  - retention_storage_bytes
  - captured_funds_time_average
  - false_positive_recovery_amount
  - locked_capital
  - gas_per_settlement
  - gas_per_judgment
  - gas_per_dispute
  - gas_per_call
  - recovery_time_blocks
  - judgment_delay_distribution
  extended:
  - cheater_net_gain
  - sales_lost_while_suspended
  - exposure_vs_bond
  - buyer_recovery_rate
  - honest_seller_delay_blocks
  - honest_seller_suspended_fraction
  - frozen_amount
  - rejected_settlement_count
  - capital_locked_time_integral
  - realized_detection_rate
  - realized_sample_rate
  scenario_specific:
  - appeal_reversal_rate
  - wrong_verdict_penalty_amount
expected_outcome: 'For a false FAIL with an appeal, the harmed seller appeals, a second verifier judges, and a reversal applies the wrong-verdict penalty to the first verifier. A false PASS is subject to automatic recheck with probability pi_v; on disagreement a third verifier decides.'
ground_truth_source: 'controller (experiments/controller) records the injected fault, the true event sequence and the expected verdict outside the runtime processes; no buyer, seller, facilitator, verifier, keeper or anvil process can read it'
pass_criteria: 'The share of final verdicts that match the controller ground truth after appeal or recheck is at least the P4 bound (party appeal: h(1 - error rate); automatic recheck: pi_v (h(1 - beta))^2); on reversal the first verifier receives the wrong-verdict penalty.'
notes: The only scenario covering both P3 and P4.
