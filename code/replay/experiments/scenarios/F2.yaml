id: F2
name: Response lost
property_under_test:
- P1
preconditions:
- settle is confirmed
- The seller produces the response and receipt
injected_fault:
  process: buyer
  kind: drop_response
  action: 'response (resp, receipt) dropped in transit before reaching buyer; buyer never observes an HTTP response for the settled purchase'
  timing: after seller sends response, before buyer receives it
parameters:
  responseBlocks:
    default: 50
    unit: blocks
  buyer_retry_count:
    default: 1
    sweep:
    - 1
    - 2
    - 5
    unit: count
  idempotency_key_reuse:
    default: true
    sweep:
    - true
    - false
n_seeds: 3
observed_metrics:
  core:
  - double_settlement_rate
  - post_settlement_unrecovered_rate
  - released_exposure
  - anchor_gas_per_epoch
  - retention_storage_bytes
  - captured_funds_time_average
  - false_positive_recovery_amount
  - locked_capital
  - gas_per_settlement
  - gas_per_judgment
  - gas_per_dispute
  - gas_per_call
  - recovery_time_blocks
  - judgment_delay_distribution
  extended:
  - cheater_net_gain
  - sales_lost_while_suspended
  - exposure_vs_bond
  - buyer_recovery_rate
  - honest_seller_delay_blocks
  - honest_seller_suspended_fraction
  - frozen_amount
  - rejected_settlement_count
  - capital_locked_time_integral
  - realized_detection_rate
  - realized_sample_rate
  scenario_specific:
  - retry_settle_attempt_count
expected_outcome: A retry with the same idempotency key derives the same nonce, so the second settle is rejected (P1 holds). If the buyer still has no response it moves to the NON_DELIVERY dispute path.
ground_truth_source: 'controller (experiments/controller) records the injected fault, the true event sequence and the expected verdict outside the runtime processes; no buyer, seller, facilitator, verifier, keeper or anvil process can read it'
pass_criteria: 'double_settlement_rate == 0; with idempotency_key_reuse true the retried settle reverts; only with idempotency_key_reuse false (a new key) is a second purchase accepted.'
notes: Separates a legitimate second purchase (new key) from a retry (same key).
