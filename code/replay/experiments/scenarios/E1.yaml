id: E1
name: Honest seller release delay under a false FAIL
property_under_test:
- P3
preconditions:
- The seller always delivers a response that satisfies the predicate
- 'The first assigned verifier submits an incorrect FAIL; the seller appeals'
- With second_verifier_wrong true the appeal verifier also submits FAIL
injected_fault:
  process: verifier
  kind: wrong_verdict
  action: assigned verifier issues an incorrect FAIL verdict against an honest, compliant seller
  timing: before judgeDue
parameters:
  misjudgment_direction:
    default: false_fail
  D_holding_blocks:
    default: profile_default
    sweep:
    - L_min/2
    - L_min
    - delta_F
    - (delta_F+L)/2
    - L
    - caseHorizon
    unit: blocks (expression over L_min, delta_F, L, caseHorizon)
  appealBlocks:
    default: profile_default
    unit: blocks
  second_verifier_wrong:
    default: false
    sweep:
    - false
    - true
    unit: bool
n_seeds: 30
observed_metrics:
  core:
  - double_settlement_rate
  - post_settlement_unrecovered_rate
  - released_exposure
  - anchor_gas_per_epoch
  - retention_storage_bytes
  - captured_funds_time_average
  - false_positive_recovery_amount
  - locked_capital
  - gas_per_settlement
  - gas_per_judgment
  - gas_per_dispute
  - gas_per_call
  - recovery_time_blocks
  - judgment_delay_distribution
  extended:
  - cheater_net_gain
  - sales_lost_while_suspended
  - exposure_vs_bond
  - buyer_recovery_rate
  - honest_seller_delay_blocks
  - honest_seller_suspended_fraction
  - frozen_amount
  - rejected_settlement_count
  - capital_locked_time_integral
  - realized_detection_rate
  - realized_sample_rate
  scenario_specific:
  - effective_hold_period_blocks
  - frozen_then_released_count
  - first_fail_to_freeze_blocks
  - wrongful_final_fail_count
  - honest_seller_pool_loss
  - reinstatement_count
  - seller_penalty_charged
expected_outcome: 'Below the case horizon (override points, freezeOnInitialFail = true) the initial FAIL freezes the bond account and suspends the seller at once; at the caseHorizon point (the production profile, freezeOnInitialFail = false) it freezes and suspends nothing. With a correct appeal verifier the FAIL is overturned, the freeze (where there was one) is cleared and the entries release on their normal schedule; the seller loses delay only: honest_seller_delay_blocks exceeds D only for entries whose release block fell inside a freeze, by at most the appeal window plus one judgment, and is never above D at the caseHorizon point. With a wrong appeal verifier the FAIL goes to the tiebreak (ADR 0019); when the tiebreak confirms it the failure is final: the account freezes (at the confirmed failure under the production timing), the claim window opens, buyers claim the frozen pool and the remainder is forfeited, so the honest seller loses its pool (honest_seller_pool_loss) plus one share of the penalty (ADR 0018) and stays suspended until the claim window closes.'
ground_truth_source: 'controller (experiments/controller) records the injected fault, the true event sequence and the expected verdict outside the runtime processes; no buyer, seller, facilitator, verifier, keeper or anvil process can read it'
pass_criteria: 'Every run is kept and classified by outcome; a run in which the FAIL is upheld is not discarded. Overturned runs: honest_seller_pool_loss == 0 and seller_penalty_charged == 0; at override points frozen_then_released_count equals the entries frozen and first_fail_to_freeze_blocks <= 1 and does not grow with D; at the caseHorizon point frozen_then_released_count == 0 and honest_seller_delay_blocks <= D. Upheld runs: wrongful_final_fail_count == 1, honest_seller_pool_loss equals v times the entries held at the freeze minus the entries later released, seller_penalty_charged equals one share, and reinstatement succeeds after the claim window and the top-up. Report both classes at every D.'
notes: 'Uses the profile appealBlocks (1,800 blocks for the data API profile). The upheld path is the costly one for an honest seller; its frequency at the operating point is h alpha + (1 - h) c per first-stage verdict squared for the appeal, and H1 measures the time cost at high rates. D sweeps the deferral grid (README, Deferral grid).'
